name: MLOps Train Pipeline

on:
  push:
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      push_to_hub:
        description: "Push model to Hugging Face Hub"
        type: boolean
        default: true
      hf_repo:
        description: "Hugging Face repo id (e.g. your-username/distilbert-reviews-genres)"
        type: string
        default: "kamalchaurasia-iitj/mlops-anli-classifier-roberta"
      hf_model_name:
        description: "HF model name for Docker build arg"
        type: string
        default: "kamalchaurasia-iitj/mlops-anli-classifier-roberta"

jobs:
  pipeline:
    runs-on: ubuntu-latest
    env:
      HF_MODEL_NAME: ${{ github.event.inputs.hf_model_name || 'kamalchaurasia-iitj/mlops-anli-classifier-roberta' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Debug - list repo root
        run: ls -la

      - name: Build Docker image
        run: docker build --build-arg HF_MODEL_NAME="${HF_MODEL_NAME}" -t mlops .

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          build-args: |
            HF_MODEL_NAME=${{ env.HF_MODEL_NAME }}
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/mlops-assignment3-group3:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/mlops-assignment3-group3:${{ github.sha }}
          
      - name: Run train pipeline
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          WANDB_API_KEY: ${{ secrets.WANDB_API_KEY }}
        run: |
          mkdir -p results
          chmod -R 777 results

          PUSH_FLAG="--no-push-to-hub"
          HF_REPO_ID_VALUE=""
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ github.event.inputs.push_to_hub }}" = "true" ] && [ -n "${{ github.event.inputs.hf_repo }}" ]; then
            PUSH_FLAG="--push-to-hub"
            HF_REPO_ID_VALUE="${{ github.event.inputs.hf_repo }}"
          fi

          docker run --rm \
            --user root \
            -e HF_TOKEN="${HF_TOKEN}" \
            -e WANDB_API_KEY="${WANDB_API_KEY}" \
            -e HF_REPO_ID="${HF_REPO_ID_VALUE}" \
            -v "${{ github.workspace }}:/app" \
            mlops python src/main.py \
              --run-mode SMALL_RUN \
              --disable-wandb \
              ${PUSH_FLAG} \
              --data-path /app/results/anli_text_classification_data.pickle \
              --label-map-path /app/id2label.json \
              --output-dir /app/results/model \
              --logging-dir /app/results/logs \
              --report-path /app/results/eval_report.json

      - name: Upload eval results
        uses: actions/upload-artifact@v4
        with:
          name: eval-results
          path: eval_results/
          retention-days: 30
